version: '3.8'

services:
  stremio-torbox:
    build: .
    container_name: stremio-torbox
    restart: unless-stopped
    ports:
      - "127.0.0.1:7000:7000"
    environment:
      - PORT=7000
      - HOST=0.0.0.0
      - BASE_URL=https://torbox.ddns.net
      - FLARESOLVERR_URL=http://flaresolverr:8191

  flaresolverr:
    image: flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info

